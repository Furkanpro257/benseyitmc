:root {
  --bg: #0C0A08;
  --bg-soft: #14120F;
  --card: #1A1714;
  --card-2: #221E19;
  --card-3: #2A251E;
  --border: rgba(251,191,36,0.12);
  --border-strong: rgba(251,191,36,0.22);
  --text: #FFFBEB;
  --muted: #A89B85;
  --muted-2: #6B645A;
  --primary: #FACC15;
  --secondary: #F97316;
  --accent: #EA580C;
  --lime: #22FF88;
  --safe-area-inset-top: 0px;
}

* {
  font-family: "Outfit", system-ui, sans-serif;
}

h1,h2,h3,.display {
  font-family: "Space Grotesk", "Outfit", sans-serif;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  overflow-x: clip;
}

/* Yükleme fallback'i: en fazla 1,5 saniye görünür, sonra kendiliğinden
   kaybolur. React render olunca #root artık boş olmadığı için :empty
   kuralı zaten devre dışı kalır ve ana içerik (Hoş geldiniz, IP,
   Duyurular, Market, Çark, Giriş / Kayıt) hemen görünür. Fallback
   hiçbir zaman sonsuza kadar ekranda takılı kalmaz. Turnstile
   async + defer ile yalnızca modal açılınca istenir; açılışı bloklamaz. */

@keyframes fallbackFade {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

html, body {
  background: #08070A;
}

#root:empty {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 12px;
  padding: 24px;
  box-sizing: border-box;
  background: radial-gradient(60% 50% at 50% 0%, rgba(250,204,21,.18), transparent 70%), radial-gradient(50% 40% at 50% 100%, rgba(249,115,22,.14), transparent 70%), #08070A;
  animation: fallbackFade 0.3s ease 1.5s forwards;
}

#root:empty::before {
  content: "Hoş geldiniz!\A oyna.BenSeyitMC.com\A BenSeyitMC";
  white-space: pre;
  text-align: center;
  font-family: "Space Grotesk", "Outfit", system-ui, sans-serif;
  font-weight: 900;
  font-size: clamp(32px, 8vw, 56px);
  line-height: 1.25;
  /* Sarı-turuncu gradient; desteklemeyen tarayıcıda düz sarı kalır. */
  color: #FACC15;
  background: linear-gradient(90deg, #FACC15 0%, #FBBF24 30%, #F97316 65%, #EA580C 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  max-width: 100%;
  overflow-wrap: anywhere;
  animation: fallbackFade 0.3s ease 1.5s forwards;
}

#root:empty::after {
  content: "Sayfa yükleniyor…";
  text-align: center;
  font-family: "Outfit", system-ui, sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: rgba(255,255,255,.55);
  animation: fallbackFade 0.3s ease 1.5s forwards;
}

::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--primary), var(--secondary));
  border-radius: 999px;
}

::-webkit-scrollbar-track {
  background: var(--bg);
}

/* glow utilities */

.glow-yellow {
  box-shadow: 0 0 40px rgba(250,204,21,0.35), 0 0 80px rgba(250,204,21,0.15);
}

.glow-orange {
  box-shadow: 0 0 40px rgba(249,115,22,0.35), 0 0 80px rgba(249,115,22,0.15);
}

.text-gradient {
  background: linear-gradient(90deg, #FACC15 0%, #F97316 50%, #EA580C 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.bg-gradient-main {
  background: linear-gradient(90deg, #FACC15 0%, #F97316 50%, #EA580C 100%);
}

.border-gradient {
  position: relative;
}

.border-gradient::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(250,204,21,0.8), rgba(249,115,22,0.6), rgba(234,88,12,0.2));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

@keyframes float {
  0%,100% {
    transform: translateY(0px) rotate(-1deg);
  }

  50% {
    transform: translateY(-14px) rotate(1deg);
  }
}

@keyframes float2 {
  0%,100% {
    transform: translateY(0px) rotate(1deg);
  }

  50% {
    transform: translateY(-10px) rotate(-1deg);
  }
}

@keyframes pulseGlow {
  0%,100% {
    opacity: 0.6;
  }

  50% {
    opacity: 1;
  }
}

@keyframes gridMove {
  0% {
    transform: translateY(0);
  }

  100% {
    transform: translateY(40px);
  }
}

@keyframes shake {
  0%,100% {
    transform: translateX(0);
  }

  20%,60% {
    transform: translateX(-4px);
  }

  40%,80% {
    transform: translateX(4px);
  }
}

.turnstile-wrap {
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  width: 100% !important;
  margin: 20px auto !important;
  padding: 20px 8px !important;
  box-sizing: border-box !important;
  overflow-x: clip !important;
  position: static !important;
}

.cf-turnstile {
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  margin: 0 auto !important;
  width: 300px !important;
  max-width: 100% !important;
  min-width: 0 !important;
  position: static !important;
  top: auto !important;
  left: auto !important;
  transform: none !important;
}

.cf-turnstile > div, .cf-turnstile iframe {
  margin-left: auto !important;
  margin-right: auto !important;
  display: block !important;
  width: 300px !important;
  max-width: 100% !important;
  box-sizing: border-box !important;

        .mono { font-family: 'JetBrains Mono', monospace; }
        .text-gradient { 
          background: linear-gradient(90deg,#FACC15 0%, #FBBF24 30%, #F97316 65%, #EA580C 100%); 
          -webkit-background-clip:text; 
          background-clip:text; 
          -webkit-text-fill-color: transparent;
          color: transparent;
          display: inline-block;
        }
        .hero-welcome {
          background: linear-gradient(90deg,#FACC15 0%, #FBBF24 25%, #F97316 60%, #EA580C 100%);
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          color: transparent;
          filter: drop-shadow(0 0 28px rgba(250,204,21,0.35)) drop-shadow(0 2px 12px rgba(249,115,22,0.25));

          padding-top: 0.06em;
          overflow: visible;
          display: inline-block;
          max-width: 100%;
        }
        @keyframes slideInRight { from { transform: translateX(100%); opacity:0 } to { transform: translateX(0); opacity:1 } }
        @keyframes fadeIn { from { opacity:0; transform: translateY(-8px) scale(0.98) } to { opacity:1; transform: translateY(0) scale(1) } }
        @keyframes glowPulse { 0%,100% { opacity:0.6 } 50% { opacity:1 } }
        @keyframes heroIn { from { opacity:0; transform: translateY(26px) scale(.98); filter: blur(6px) } to { opacity:1; transform: translateY(0) scale(1); filter: blur(0) } }
        @keyframes cardLift { from { transform: translateY(0) } to { transform: translateY(-6px) } }
        @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity:1 } 100% { transform: translateY(340px) rotate(540deg); opacity:0 } }
        @keyframes modalIn { from { opacity:0; transform: scale(.92) translateY(12px) } to { opacity:1; transform: scale(1) translateY(0) } }
        @keyframes xpFill { from { width:0 } to { width:100% } }
        @keyframes shimmer { 0% { background-position:-400px 0 } 100% { background-position:400px 0 } }
        @keyframes authShake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-7px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(3px) } }
        .auth-shake { animation: authShake .45s ease; }
        @keyframes splashIn { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform: translateY(0) } }
        .splash-anim { animation: splashIn .35s ease both; }
        .hero-anim { animation: heroIn .8s cubic-bezier(.16,1,.3,1) both; }
        .hero-anim-1 { animation-delay:.05s } .hero-anim-2 { animation-delay:.16s } .hero-anim-3 { animation-delay:.28s } .hero-anim-4 { animation-delay:.4s }

        .btn-glow { position:relative; overflow:hidden; transition: transform .2s, box-shadow .3s, background-position .5s; background-size:200% 100%; }
        .btn-glow:hover { background-position:100% 0; box-shadow:0 0 34px rgba(249,115,22,.55); transform: translateY(-1px); }
        .btn-glow:active { transform: scale(.97); }
